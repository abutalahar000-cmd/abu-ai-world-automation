name: Abu AI World Daily Automation

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Abu AI World
        run: python main.py
