[project]
name = "facebook-ai-photo-automation"
version = "1.0.0"
description = "Random AI photo generation and approval-gated Facebook Page publishing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
